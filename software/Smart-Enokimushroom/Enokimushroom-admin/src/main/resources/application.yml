# 项目相关配置
ruoyi:
  # 名称
  name: SmartEnokimushroom
  # 版本
  version: 3.8.0
  # 版权年份
  copyrightYear: 2024
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100
    # 连接超时时间（毫秒），0表示永不超时，避免SSE长连接被中断
    connection-timeout: 0
    # 异步请求超时时间（毫秒），300秒=5分钟，支持Ollama长时间思考
    async:
      request-timeout: 300000

# 日志配置
logging:
  level:
    com.enokimushroom: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
            platform: mysql
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3.5:0.8b

      embedding:
        model: nomic-embed-text
        dimensions: 1024
    openai:
      api-key: sk-b54733188a2e4fac82d0db716ef35ddc
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-max-latest
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024
    deepseek:
      api-key: sk-2768ebda7eb943ac90297e039603abe4
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

  mqtt:
    username: admin # 用户名
    password: syh040519 # 密码
    hostUrl: tcp://broker.emqx.io:1883 # tcp://ip:端口 localhost：1883
    clientId: emqxrr12234565 # 客户端id
    #    defaultTopic: topic,topic1 # 订阅主题
    defaultTopic: Agrcul20250725,pus20250725,/air/post,/soil/post,enokimushroom_fan,enokimushroom_irrigation
    timeout: 10 # 超时时间 （单位：秒）
    keepalive: 60 # 心跳 （单位：秒）
    enabled: true # 是否使能mqtt功能

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置（系统原有配置）
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.enokimushroom.**.domain,com.enokimushroom.**.entity
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.enokimushroom.web.controller.tool

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# MyBatis-Plus配置（新增配置）
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.enokimushroom.**.domain,com.enokimushroom.**.entity
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml
  global-config:
    db-config:
      logic-delete-field: status
      logic-delete-value: 0
      logic-not-delete-value: 1
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    local-cache-scope: statement
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 开启缓存
    cache-enabled: true
    # 延迟加载
    lazy-loading-enabled: true
    # 积极延迟加载
    aggressive-lazy-loading: false

qwen:
  api-key: sk-10510f4f7a4248c789b6029c309b0de0
  base-url: https://dashscope.aliyuncs.com
  model: qwen-max-latest